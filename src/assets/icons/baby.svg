<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <style>
    :root{
      --icon-color:#5f6368;
      --stroke-width:42;
    }
    .line{
      fill:none;
      stroke:var(--icon-color);
      stroke-width:var(--stroke-width);
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .dot{
      fill:var(--icon-color);
    }
  </style>

  <!-- face outline with ears -->
  <path class="line" d="
    M196 473
